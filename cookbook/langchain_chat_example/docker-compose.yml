version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: langchain-chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - langchain-network

  app:
    build: .
    container_name: langchain-chat-app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-your-api-key-here}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - langchain-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  langchain-network:
    driver: bridge
